<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Local SEO Checker | Instantly Grade Your Google Business Profile</title>
    <meta name="description" content="Get a free local SEO health check for your business. Instantly see your Google Business Profile grade and get personalized tips to improve your local search visibility. No signup required.">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2E8B57;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        input[type="text"], select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .radio-option input[type="radio"] {
            margin: 0;
        }
        button {
            background-color: #2E8B57;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #246B47;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 14px;
        }
        .ad-space {
            height: 100px;
            background-color: #f0f0f0;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            border-radius: 5px;
        }
        .help-text {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Is Your Business Easy to Find Online?</h1>
        
        <div class="ad-space">Advertisement Space</div>
        
        <form action="results.html" method="GET">
            <div class="form-group">
                <label for="business-name">Business Name</label>
                <input type="text" id="business-name" name="business-name" required>
            </div>
            
            <div class="form-group">
                <label for="business-category">Business Category</label>
                <select id="business-category" name="business-category" required>
                    <option value="">Select your business type</option>
                    <optgroup label="Home Services">
                        <option value="electrician">Electrician</option>
                        <option value="plumber">Plumber</option>
                        <option value="hvac">HVAC Contractor</option>
                        <option value="roofer">Roofing Contractor</option>
                        <option value="painter">Painting Contractor</option>
                        <option value="landscaper">Landscaper</option>
                        <option value="handyman">Handyman Services</option>
                        <option value="cleaning">Cleaning Services</option>
                    </optgroup>
                    <optgroup label="Food & Retail">
                        <option value="restaurant">Restaurant</option>
                        <option value="cafe">Cafe</option>
                        <option value="retail">Retail Store</option>
                        <option value="grocery">Grocery Store</option>
                    </optgroup>
                    <optgroup label="Professional Services">
                        <option value="lawyer">Law Firm</option>
                        <option value="accountant">Accounting Firm</option>
                        <option value="insurance">Insurance Agency</option>
                        <option value="realestate">Real Estate Agency</option>
                    </optgroup>
                    <optgroup label="Health & Wellness">
                        <option value="doctor">Medical Practice</option>
                        <option value="dentist">Dental Practice</option>
                        <option value="chiropractor">Chiropractic</option>
                        <option value="salon">Hair Salon</option>
                        <option value="spa">Spa</option>
                        <option value="gym">Fitness Center</option>
                    </optgroup>
                    <optgroup label="Automotive">
                        <option value="mechanic">Auto Repair</option>
                        <option value="dealership">Car Dealership</option>
                        <option value="detailing">Auto Detailing</option>
                    </optgroup>
                    <optgroup label="Other">
                        <option value="other">Other Business Type</option>
                    </optgroup>
                </select>
            </div>
            
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required>
            </div>

            <div class="form-group">
                <label>Have you claimed your Google Business Profile?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="gmb-claimed" value="true" required>
                        Yes, I've claimed it
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="gmb-claimed" value="false">
                        No, not yet
                    </label>
                </div>
                <p class="help-text">This helps us provide the most relevant advice for your business.</p>
            </div>

            <div class="form-group">
                <label for="review-count">Current Number of Google Reviews</label>
                <input type="number" id="review-count" name="review-count" min="0" max="1000" value="0" required>
                <p class="help-text">Enter 0 if you don't have any reviews yet.</p>
            </div>
            
            <button type="submit">Check My Business</button>
        </form>
        
        <div class="ad-space">Advertisement Space</div>
        
        <div class="footer">
            Powered by Gentoolink Web Services.
        </div>
    </div>
</body>
</html>
